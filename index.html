<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="40の質問から4つの副業軸を測り、16タイプと始めやすい副業を提案する無料診断。回答は保存・送信されません。">
<title>副業16タイプ診断｜続けやすい副業を見つける</title>
<style>
:root{
  --bg:#fff9f1;--card:#fff;--ink:#252144;--sub:#6f6888;--line:#eadff2;
  --navy:#4c2f88;--teal:#20bea9;--coral:#ff6b68;--violet:#7c4dff;--rose:#ff4f9a;
  --yellow:#ffd84d;--cyan:#39c8ff;--mint:#72e4c4;
  --soft-teal:#e8fbf3;--soft-coral:#fff0e8;--soft-violet:#f1edff;--soft-rose:#fff0f7;
  --shadow:0 22px 60px rgba(100,67,154,.14);--shadow-sm:0 10px 28px rgba(100,67,154,.10);
  --radius:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,-apple-system,BlinkMacSystemFont,sans-serif;
  background:
    radial-gradient(circle at 8% 2%,rgba(255,216,77,.32),transparent 25rem),
    radial-gradient(circle at 94% 13%,rgba(57,200,255,.19),transparent 27rem),
    radial-gradient(circle at 73% 78%,rgba(255,79,154,.12),transparent 30rem),
    radial-gradient(circle at 18% 72%,rgba(114,228,196,.18),transparent 24rem),
    var(--bg);
  color:var(--ink);line-height:1.75;-webkit-text-size-adjust:100%;
}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit}
img{display:block;max-width:100%}
.hidden{display:none!important}
.skip-link{position:fixed;top:10px;left:10px;z-index:1000;transform:translateY(-150%);padding:10px 16px;border-radius:10px;background:var(--navy);color:#fff}
.skip-link:focus{transform:none}
.wrap{width:min(calc(100% - 32px),1080px);margin:0 auto;padding:18px 0 72px}
button:focus-visible,a:focus-visible{outline:3px solid rgba(124,77,255,.38);outline-offset:4px}

/* introduction */
.hero{
  min-height:650px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);
  grid-template-areas:"copy art" "action art";grid-template-rows:auto auto;
  align-items:center;column-gap:48px;row-gap:0;padding:64px;border:2px solid rgba(255,255,255,.94);
  border-radius:36px;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(255,248,254,.92));box-shadow:var(--shadow);overflow:hidden;position:relative;
}
.hero:before{content:"";position:absolute;width:390px;height:390px;right:-100px;top:-150px;border-radius:50%;background:conic-gradient(from 35deg,rgba(255,216,77,.34),rgba(57,200,255,.25),rgba(124,77,255,.22),rgba(255,79,154,.28),rgba(255,216,77,.34));filter:blur(3px)}
.hero:after{content:"✦";position:absolute;left:42%;top:7%;color:var(--yellow);font-size:34px;text-shadow:70px 88px 0 rgba(57,200,255,.45),-315px 210px 0 rgba(255,79,154,.34),260px 430px 0 rgba(124,77,255,.28);pointer-events:none}
.hero-copy{grid-area:copy;position:relative;z-index:2}
.hero-action{grid-area:action;position:relative;z-index:2;align-self:start}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;color:#6d42db;font-size:12px;font-weight:900;letter-spacing:.12em}
.eyebrow:before{content:"";width:20px;height:2px;background:currentColor}
.hero h1{font-size:clamp(38px,5.2vw,64px);line-height:1.16;letter-spacing:-.055em;margin-bottom:22px}
.hero h1 .accent{background:linear-gradient(105deg,var(--violet),var(--rose) 58%,#ff8a48);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{max-width:590px;color:var(--sub);font-size:16px;margin-bottom:28px}
.badges{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:30px}
.badge{padding:8px 13px;border:1px solid #eadff2;border-radius:999px;background:#fff7c8;color:#5d5277;font-size:12px;font-weight:800;box-shadow:0 5px 13px rgba(109,66,219,.07)}
.badge:nth-child(2){background:#e4fbf3}.badge:nth-child(3){background:#fff0f7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:14px 28px;border:0;border-radius:17px;background:linear-gradient(120deg,var(--violet),var(--rose) 62%,#ff7c54);color:#fff;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 13px 28px rgba(183,65,169,.29);transition:transform .18s,box-shadow .18s,filter .18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 17px 34px rgba(183,65,169,.36);filter:saturate(1.08)}
.btn.sub{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:none}
.note{max-width:580px;margin-top:18px;color:#7b8498;font-size:11px;line-height:1.8}
.hero-art{grid-area:art;width:100%;aspect-ratio:3/2;align-self:center;position:relative;z-index:1;padding:6px;border-radius:30px;background:linear-gradient(135deg,var(--yellow),var(--coral),var(--violet),var(--cyan));box-shadow:0 20px 42px rgba(129,73,194,.24);transform:rotate(1.2deg)}
.hero-image{width:100%;height:100%;border-radius:24px;object-fit:cover;object-position:center;filter:saturate(1.05)}
.hero-stamp{position:absolute;z-index:3;left:50%;bottom:-9px;transform:translateX(-50%) rotate(-2deg);padding:11px 16px;border:2px solid rgba(255,255,255,.75);border-radius:14px;background:linear-gradient(120deg,#5f36c8,var(--rose));color:#fff;font-size:12px;font-weight:900;box-shadow:0 10px 22px rgba(124,77,255,.27);white-space:nowrap}

/* quiz */
#quiz{max-width:880px;margin:auto}
.progress-wrap{position:sticky;top:0;z-index:10;padding:12px 0 10px;background:rgba(255,249,241,.92);backdrop-filter:blur(12px)}
.progress-meta{display:flex;justify-content:space-between;margin-bottom:7px;color:var(--sub);font-size:12px;font-weight:800}
.progress{height:9px;border-radius:999px;background:#eee4f4;overflow:hidden}
.progress-bar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--rose),var(--yellow),var(--teal));transition:width .28s ease}
.qcard{margin-top:22px;padding:54px 46px 34px;border:2px solid rgba(255,255,255,.96);border-radius:30px;background:linear-gradient(150deg,rgba(255,255,255,.98),rgba(255,247,252,.96));box-shadow:var(--shadow)}
.qnum{margin-bottom:18px;color:var(--violet);font-size:12px;font-weight:900;letter-spacing:.14em}
.qtext{min-height:3.3em;margin:0 auto 44px;max-width:700px;text-align:center;font-size:clamp(23px,3.8vw,34px);font-weight:900;line-height:1.5;letter-spacing:-.02em}
.scale{display:flex;align-items:center;justify-content:space-between;gap:12px}
.scale-label{width:74px;flex:none;color:var(--sub);font-size:11px;font-weight:800;line-height:1.45}
.scale-label.r{text-align:right}
.dots{display:flex;align-items:center;justify-content:center;gap:15px;flex:1}
.dot{border-radius:50%;border:3px solid;background:transparent;cursor:pointer;transition:transform .15s,background .15s;position:relative}
.dot:hover{transform:scale(1.10)}
.dot[data-v="2"],.dot[data-v="-2"]{width:58px;height:58px}
.dot[data-v="1"],.dot[data-v="-1"]{width:47px;height:47px}
.dot[data-v="0"]{width:36px;height:36px}
.dot[data-v="2"],.dot[data-v="1"]{border-color:var(--coral)}
.dot[data-v="-1"],.dot[data-v="-2"]{border-color:var(--violet)}
.dot[data-v="0"]{border-color:#b9a9cb}
.dot.on[data-v="2"],.dot.on[data-v="1"]{background:linear-gradient(145deg,var(--coral),#ff9c4a)}
.dot.on[data-v="0"]{background:#b9a9cb}
.dot.on[data-v="-1"],.dot.on[data-v="-2"]{background:var(--violet)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:32px;padding-top:22px;border-top:1px solid var(--line)}
.linkbtn{padding:8px;border:0;background:none;color:var(--sub);font-size:13px;font-weight:800;cursor:pointer}
.linkbtn:disabled{opacity:.3;cursor:default}
.key-help{color:#8991a2;font-size:11px}

/* result */
#result{max-width:980px;margin:auto}
.rcard{--type:#ff6b68;--type2:#ffd84d;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(300px,.88fr);column-gap:44px;padding:48px;border:2px solid rgba(255,255,255,.36);border-radius:32px;background:linear-gradient(140deg,#43217e 0%,#6534b4 54%,#d94f91 125%);box-shadow:0 24px 62px rgba(78,38,132,.25);color:#fff;text-align:left;overflow:hidden;position:relative}
.rcard:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 8% 8%,color-mix(in srgb,var(--type2) 25%,transparent),transparent 28%),radial-gradient(circle at 94% 88%,color-mix(in srgb,var(--type) 36%,transparent),transparent 38%);pointer-events:none}
.rcard:after{content:"✦";position:absolute;right:7%;top:7%;color:color-mix(in srgb,var(--type2) 82%,white);font-size:27px;text-shadow:-72px 48px 0 color-mix(in srgb,var(--type) 62%,transparent),34px 196px 0 rgba(255,255,255,.2),-455px 390px 0 color-mix(in srgb,var(--type2) 43%,transparent);pointer-events:none}
.rkicker,.rname,.rcode,.rcatch,.rdesc,.axes,.border-result{grid-column:1;position:relative;z-index:2}
.rkicker{color:#d8def1;font-size:11px;font-weight:900;letter-spacing:.15em}
.rname{margin:8px 0 8px;font-size:clamp(34px,5vw,54px);line-height:1.2;letter-spacing:-.04em}
.rcode{display:flex;gap:6px;margin:0 0 18px}
.code-chip{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);font-size:14px;font-weight:900;letter-spacing:0}
.rcatch{margin-bottom:22px;color:#dbe1f1;font-size:16px}
.figure{grid-column:2;grid-row:1 / span 7;align-self:center;aspect-ratio:1;border:2px solid rgba(255,255,255,.28);border-radius:30px;overflow:hidden;background:radial-gradient(circle at 50% 52%,rgba(255,255,255,.18),rgba(255,255,255,.05) 47%,rgba(39,16,86,.26) 78%);box-shadow:inset 0 0 40px rgba(255,255,255,.07),0 18px 38px rgba(33,13,72,.22);position:relative;z-index:2;isolation:isolate}
.figure:before{content:"";position:absolute;z-index:0;inset:10%;border-radius:50%;background:conic-gradient(from 8deg,transparent 0 7%,var(--type2) 12%,var(--type) 22%,transparent 29% 42%,var(--type2) 50%,var(--type) 61%,transparent 69% 82%,var(--type2) 90%,transparent 98%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 14px),#000 calc(100% - 13px));mask:radial-gradient(farthest-side,transparent calc(100% - 14px),#000 calc(100% - 13px));filter:drop-shadow(0 0 9px var(--type)) drop-shadow(0 0 18px var(--type2));opacity:.94;animation:auraSpin 18s linear infinite}
.figure:after{content:"";position:absolute;z-index:0;inset:3%;border-radius:50%;background:radial-gradient(circle at 18% 27%,var(--type2) 0 2px,transparent 3px),radial-gradient(circle at 84% 24%,#fff 0 2px,transparent 3px),radial-gradient(circle at 77% 75%,var(--type) 0 3px,transparent 4px),radial-gradient(circle at 20% 78%,#fff 0 1px,transparent 3px),radial-gradient(circle at 51% 8%,var(--type2) 0 3px,transparent 5px),repeating-conic-gradient(from 5deg,rgba(255,255,255,.12) 0 1deg,transparent 1deg 18deg);filter:drop-shadow(0 0 6px var(--type2));opacity:.78;animation:auraPulse 3.8s ease-in-out infinite}
.figure img{width:100%;height:100%;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 15px 14px rgba(25,10,59,.30)) drop-shadow(0 0 8px rgba(255,255,255,.20));transform:scale(1.03);transform-origin:center bottom}
@keyframes auraSpin{to{transform:rotate(360deg)}}
@keyframes auraPulse{50%{opacity:1;transform:scale(1.035)}}
.ph{display:grid;place-items:center;height:100%;padding:20px;color:#dbe1f1;text-align:center;font-size:12px}
.ph .em{display:block;font-size:40px}
.rdesc{margin:0 0 24px;color:#f0f3fa;font-size:14px}
.axes{padding-top:22px;border-top:1px solid rgba(255,255,255,.14)}
.axis{margin-bottom:17px}
.axis-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;color:#cbd3e7;font-size:10px}
.axis-top b{color:#fff}
.axis-bar{height:9px;border-radius:999px;background:rgba(255,255,255,.14);position:relative}
.axis-bar:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.48)}
.axis-fill{position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--type),var(--type2));box-shadow:0 0 9px color-mix(in srgb,var(--type) 65%,transparent)}
.reason.border-result{margin-top:18px;background:rgba(255,255,255,.10);color:#f1f4fa}
.sec{margin-top:18px;padding:34px;border:2px solid rgba(255,255,255,.92);border-radius:26px;background:rgba(255,255,255,.93);box-shadow:var(--shadow-sm)}
.sec h2{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:21px}
.sec .h-note{margin-bottom:20px;color:var(--sub);font-size:12px}
.job-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.job{display:flex;flex-direction:column;min-width:0;margin-bottom:12px;padding:18px;border:1px solid #e9ddf3;border-radius:18px;background:linear-gradient(155deg,#fff,#fff8fd);box-shadow:0 7px 18px rgba(102,68,148,.07)}
.job.ng{background:linear-gradient(155deg,#fff,#fff5ec);border-color:#f4d9c8}
.job-head{margin-bottom:7px}
.job-name{font-size:16px;font-weight:900}
.job-meta{margin-bottom:9px;color:var(--sub);font-size:10px}
.job-desc{color:#4d5870;font-size:12px}
.job-reason{margin-top:10px;padding:10px 12px;border-radius:10px;background:linear-gradient(135deg,#e8fbf3,#f0fff4);color:#315f55;font-size:11px;line-height:1.65}
.job.ng .job-reason{background:linear-gradient(135deg,#fff0e8,#fff5d9);color:#7c493f}
.video-link{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:46px;margin-top:auto;padding:10px 13px;border-radius:13px;background:linear-gradient(120deg,var(--violet),var(--rose),#ff7659);color:#fff!important;font-size:12px!important;font-weight:900;text-decoration:none!important;box-shadow:0 9px 20px rgba(179,65,171,.25);transition:transform .18s,box-shadow .18s,filter .18s}
.video-link:before{content:"▶";display:grid;place-items:center;width:25px;height:25px;flex:0 0 25px;border-radius:50%;background:rgba(255,255,255,.18);font-size:10px}
.video-link:hover{transform:translateY(-1px);box-shadow:0 11px 22px rgba(113,100,216,.30);filter:saturate(1.08)}
.video-link:focus-visible{outline:3px solid rgba(113,100,216,.32);outline-offset:3px}
.job .job-desc:last-of-type{margin-bottom:18px}
.advisor{display:block;min-height:0;height:auto;overflow:hidden;position:relative}
.advisor:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;opacity:.5;pointer-events:none}
.advisor-fit:before{left:-110px;top:-130px;background:linear-gradient(135deg,var(--yellow),var(--mint))}
.advisor-ng:before{right:-110px;top:-130px;background:linear-gradient(135deg,#ffc2de,#ffd79c)}
.advisor-flow{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:0;width:100%;min-height:0;height:auto;position:relative;z-index:1}
.advisor-head{display:flex;align-items:center;min-height:124px;height:auto;margin:0 0 16px;padding-left:128px;position:relative}
.advisor-character{position:absolute;left:0;top:50%;width:112px;height:auto;max-height:124px;transform:translateY(-50%);object-fit:contain;object-position:center bottom;filter:drop-shadow(0 12px 16px rgba(31,44,78,.12))}
.advisor-bubble{width:100%;padding:20px 22px;border:1px solid;position:relative;border-radius:20px}
.advisor-fit .advisor-bubble{background:linear-gradient(135deg,#e8fbf3,#fff9ce);border-color:#c8ecd9}
.advisor-ng .advisor-head{padding-right:128px;padding-left:0}
.advisor-ng .advisor-character{right:0;left:auto}
.advisor-ng .advisor-bubble{background:linear-gradient(135deg,#fff0f7,#fff6d8);border-color:#f2d6df}
.advisor-bubble:before{content:"";position:absolute;left:-10px;top:50%;width:18px;height:18px;transform:translateY(-50%) rotate(45deg);background:inherit;border-left:1px solid;border-bottom:1px solid;border-color:inherit}
.advisor-ng .advisor-bubble:before{left:auto;right:-10px;border-left:0;border-bottom:0;border-right:1px solid;border-top:1px solid;border-color:inherit}
.advisor-bubble h2{margin-bottom:5px}
.advisor-bubble .h-note{margin:0}
.advisor .job-grid,.advisor .reason,.advisor .caution{flex:0 0 auto;position:relative;z-index:1}
.reason,.caution{margin-top:16px;padding:18px;border-radius:16px;color:#4d5870;font-size:13px}
.reason{background:linear-gradient(135deg,#f1edff,#eafcff)}
.caution{background:linear-gradient(135deg,#fff0e8,#fff7d7)}
.reason>b:first-child,.caution>b:first-child{display:block;margin-bottom:5px;color:var(--ink)}
.retry{text-align:center;margin-top:34px}
.disc{max-width:850px;margin:24px auto 0;padding:18px;border-radius:16px;background:#f1eaf5;color:#6f6888;font-size:10px;line-height:1.8}
.public-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.public-links a{padding:7px 10px;border-radius:10px;background:#f4edff;color:var(--navy);font-size:10px;font-weight:800}
/* responsive */
@media(max-width:840px){
  .hero{grid-template-columns:1fr;grid-template-areas:"copy" "art" "action";min-height:0;padding:46px 34px}
  .hero-art{max-width:560px;margin:auto}
  .job-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rcard{grid-template-columns:1fr;padding:34px}
  .rkicker,.rname,.rcode,.rcatch,.rdesc,.axes,.border-result,.figure{grid-column:1}
  .figure{grid-row:auto;max-width:390px;width:100%;margin:24px auto}
}
@media(max-width:560px){
  .wrap{width:min(calc(100% - 16px),1080px);padding:8px 0 40px}
  .hero{grid-template-areas:"copy" "art" "action";padding:20px 16px 18px;border-radius:24px;row-gap:7px}
  .eyebrow{margin-bottom:8px;font-size:10px}
  .hero h1{margin-bottom:11px;font-size:clamp(29px,9vw,34px);line-height:1.12}
  .hero .lead{margin-bottom:10px;font-size:13px;line-height:1.58}
  .badges{margin-bottom:0}
  .badge{padding:6px 11px;font-size:11px}
  .hero-art{aspect-ratio:3/2}
  .hero-image{border-radius:18px}
  .hero-stamp{bottom:-5px;padding:7px 10px;border-radius:10px;font-size:9px}
  .hero-action{width:100%}
  .hero-action .btn{min-height:54px}
  .note{margin-top:11px;font-size:9px;line-height:1.65}
  .qcard{padding:38px 18px 24px;border-radius:24px}
  .qtext{font-size:23px;margin-bottom:36px}
  .scale{gap:4px}.scale-label{width:48px;font-size:9px}
  .dots{gap:7px}
  .dot[data-v="2"],.dot[data-v="-2"]{width:46px;height:46px}
  .dot[data-v="1"],.dot[data-v="-1"]{width:38px;height:38px}
  .dot[data-v="0"]{width:31px;height:31px}
  .key-help{display:none}
  .rcard{padding:28px 20px;border-radius:25px}
  .rname{font-size:34px}
  .sec{padding:25px 18px;border-radius:22px}
  .sec h2{font-size:19px}
  .job-grid{grid-template-columns:1fr}
  .advisor{padding-top:18px}
  .advisor-head{min-height:82px;margin:0 0 12px;padding-left:82px}
  .advisor-character{width:72px;height:auto;max-height:82px}
  .advisor-ng .advisor-head{padding-right:82px;padding-left:0}
  .advisor-bubble{padding:15px 14px;border-radius:16px}
  .advisor-bubble h2{font-size:17px;line-height:1.4}
  .advisor-bubble .h-note{font-size:10px;line-height:1.6}
  .advisor-bubble:before{left:-7px;width:13px;height:13px}
  .advisor-ng .advisor-bubble:before{left:auto;right:-7px}
  .btn{width:100%}
}
@media(max-width:560px) and (max-height:700px){
  .hero{padding-top:15px;row-gap:3px}
  .eyebrow{margin-bottom:5px}
  .hero h1{margin-bottom:8px;font-size:28px}
  .hero .lead{margin-bottom:7px;font-size:12px;line-height:1.48}
  .hero-art{aspect-ratio:16/9}
  .hero-action .btn{min-height:50px}
  .note{margin-top:8px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<a class="skip-link" href="#intro">本文へ移動</a>
<div class="wrap">

<!-- ================= INTRO ================= -->
<section id="intro">
  <div class="hero">
    <div class="hero-copy">

function startQuiz(){
  clearTimeout(transitionTimer); transitionTimer = null;
  document.getElementById("intro").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  idx = 0; answers.fill(null);
  render();
  window.scrollTo(0,0);
}

function render(){
  const q = QUESTIONS[idx];
  document.getElementById("qnum").textContent = "QUESTION " + (idx+1);
  document.getElementById("qtext").textContent = q.text;
  document.getElementById("pmeta").textContent = "Q" + (idx+1) + " / " + QUESTIONS.length;
  const pct = Math.round((idx + 1) / QUESTIONS.length * 100);
  document.getElementById("ppct").textContent = pct + "%";
  document.getElementById("pbar").style.width = pct + "%";
  document.querySelector(".progress").setAttribute("aria-valuenow", String(idx + 1));
  document.getElementById("backBtn").disabled = (idx === 0);
  document.querySelectorAll(".dot").forEach(function(d){
    d.classList.toggle("on", answers[idx] !== null && Number(d.dataset.v) === answers[idx]);
  });
}

  if(transitionTimer !== null) return;

    transitionTimer = null;
    if(idx < QUESTIONS.length - 1){ idx++; render(); }
    else { showResult(); }
  }, 180);
}

function goBack(){ if(transitionTimer === null && idx > 0){ idx--; render(); } }

/* =========================================================
   判定
   ========================================================= */
function computeScores(responseValues){
  const values = responseValues || answers;
  const raw = {fs:0, eb:0, la:0, pd:0};
  const buckets = {digital:[], verify:[], admin:[], emotion:[], time:[]};
  let pc = .5;
  QUESTIONS.forEach(function(q,i){
    const answerValue = values[i] === null || values[i] === undefined ? 0 : values[i];
    const adjusted = q.rev ? -answerValue : answerValue;
    if(q.kind === "axis") raw[q.axis] += adjusted;
    else {
      const normalized = (adjusted + 2) / 4;
      buckets[q.indicator].push(normalized);
      if(q.indicator === "digital" && buckets.digital.length === 1) pc = normalized;
    }
  });
  const norm = {};
  for(const k in raw) norm[k] = raw[k] / 16;   /* 各軸8問: -1.0 〜 +1.0 */
  const indicators = {pc:pc};
  for(const k in buckets){
    const valuesForIndicator = buckets[k];
    indicators[k] = valuesForIndicator.reduce(function(sum,value){ return sum + value; },0) / valuesForIndicator.length;
  }
  return {norm:norm, raw:raw, indicators:indicators, values:values};
}

function resolveAxisDirection(profile, axis){
  if(profile.raw[axis.k] !== 0) return profile.raw[axis.k] > 0 ? 1 : -1;
  const anchors = QUESTIONS.map(function(q,index){ return {q:q,index:index}; })
    .filter(function(item){ return item.q.kind === "axis" && item.q.axis === axis.k && item.q.anchor; })
    .sort(function(a,b){ return a.q.anchor - b.q.anchor; });
  for(const anchor of anchors){
    const answerValue = profile.values[anchor.index] || 0;
    const adjusted = anchor.q.rev ? -answerValue : answerValue;
    if(adjusted !== 0) return adjusted > 0 ? 1 : -1;
  }
  return -1; /* 全回答中立時は初心者向けの低リスク側 F/B/L/P */
}

function typeCode(profile){
  return AXES.map(function(axis){
    return resolveAxisDirection(profile, axis) > 0 ? axis.pl : axis.nl;
  }).join("");
}

const AXIS_REASON = {
  fs:"報酬を得るまでの待ち方",
  eb:"人前に出る範囲や対人交流の量",
  la:"得意な表現手段",
  pd:"計画と行動のペース"
};
const READINESS_REASON = {
  digital:"PC・オンラインツールの準備度",
  verify:"情報を確かめて品質を守る力",
  admin:"期限管理と依頼者への確認・連絡",
  emotion:"重い話を受け止めて切り替える力"
};

function scoreJob(profile, job){
  const settings = JOB_PROFILES[job.n];
  if(!settings) throw new Error("副業プロファイルがありません: " + job.n);
  const target = settings.t || job.c;
  let styleNumerator = 0, styleDenominator = 0;
  const axisPenalties = {};
  for(const k in settings.i){
    /* 8問平均は中央へ集まりやすいため、符号と順位を保ったまま感度を補正する。 */
    const measured = Math.sign(profile.norm[k]) * Math.sqrt(Math.abs(profile.norm[k]));
    const difference = Math.abs(measured - target[k]) / 2;
    const contribution = settings.i[k] * difference * difference;
    styleNumerator += contribution;
    styleDenominator += settings.i[k];
    axisPenalties[k] = difference * settings.i[k];
  }
  const styleMismatch = Math.sqrt(styleNumerator / styleDenominator);
  const styleScore = Math.max(0, 100 * (1 - styleMismatch));

  const readinessGaps = {};
  const requirements = settings.r || {};
  for(const k in requirements){
    const minimum = requirements[k];
    const actual = profile.indicators[k];
    readinessGaps[k] = Math.max(0, (minimum - actual) / minimum);
  }
  const readinessKeys = Object.keys(readinessGaps);
  const readinessGap = readinessKeys.length
    ? readinessKeys.reduce(function(sum,k){ return sum + readinessGaps[k]; },0) / readinessKeys.length
    : 0;
  const readinessScore = 100 * (1 - readinessGap);

  const feasibility = settings.f || {};
  const timeMinimum = feasibility.time || 0;
  const timeGap = timeMinimum ? Math.max(0, (timeMinimum - profile.indicators.time) / timeMinimum) : 0;
  let feasibilityScore = 100 * (1 - timeGap);
  const hardPC = feasibility.pc === true && profile.indicators.pc < .5;
  if(hardPC) feasibilityScore = Math.min(feasibilityScore, 15);

  const emotion = profile.indicators.emotion;
  const emotionLow = settings.emotionGate === true && emotion < .35;
  const emotionMedium = settings.emotionGate === true && emotion >= .35 && emotion < .625;
  if(emotionLow) feasibilityScore = Math.min(feasibilityScore, 20);
  if(emotionMedium) feasibilityScore = Math.min(feasibilityScore, 40 + 60 * ((emotion - .35) / .275));

  const verifyLow = settings.verifyGate !== undefined && profile.indicators.verify < settings.verifyGate;
  if(verifyLow) feasibilityScore = Math.min(feasibilityScore, 35);

  let total = .55 * styleScore + .25 * readinessScore + .15 * feasibilityScore + .05 * settings.b;
  const stretchReady = settings.stretch !== true || (
    styleScore >= 88 && profile.indicators.digital >= .85 &&
    profile.indicators.verify >= .75 && profile.indicators.time >= .8
  );
  if(!stretchReady) total = Math.min(total, 65);
  if(hardPC || emotionLow || verifyLow) total = Math.min(total, 42);

  const readinessMax = readinessKeys.reduce(function(best,k){
    return readinessGaps[k] > best.value ? {key:k,value:readinessGaps[k]} : best;
  }, {key:"",value:0});
  const axisMax = Object.keys(axisPenalties).reduce(function(best,k){
    return axisPenalties[k] > best.value ? {key:k,value:axisPenalties[k]} : best;
  }, {key:"",value:0});

  const penaltyCandidates = [
    {kind:"hardPC", value:hardPC ? 120 : 0},
    {kind:"readiness", key:readinessMax.key, value:readinessMax.value * 60},
    {kind:"style", key:axisMax.key, value:styleMismatch * 48},
    {kind:"time", value:timeGap * 65},
    {kind:"emotion", value:settings.emotionGate ? Math.max(0, (.625 - emotion) / .625) * 95 : 0},
    {kind:"verifyGate", value:verifyLow ? 90 : 0}
  ].sort(function(a,b){ return b.value - a.value; });

  return {
    job:job,
    total:total,
    styleScore:styleScore,
    styleMismatch:styleMismatch,
    readinessScore:readinessScore,
    feasibilityScore:feasibilityScore,
    hardPC:hardPC,
    eligible:job.ok !== false && !hardPC && !emotionLow && !verifyLow && stretchReady,
    primaryPenalty:penaltyCandidates[0],
    unfitScore:penaltyCandidates[0].value + penaltyCandidates[1].value * .25
  };
}

function rankJobs(profile){
  return JOBS.map(function(job){ return scoreJob(profile,job); })
    .sort(function(a,b){ return b.total - a.total || a.job.n.localeCompare(b.job.n,"ja"); });
}

function pickFit(ranked){
  const out = [];
  let clientWorkCount = 0;
  for(const scored of ranked){
    if(!scored.eligible) continue;
    if(scored.job.cat === "受託" && clientWorkCount >= 2) continue;
    out.push(scored);
    if(scored.job.cat === "受託") clientWorkCount++;
    if(out.length === 3) break;
  }

  if(out.length === 3 && out[0].job.cat === out[1].job.cat && out[1].job.cat === out[2].job.cat){
    const replacement = ranked.find(function(candidate){
      return candidate.eligible && candidate.job.cat !== out[2].job.cat &&
        out.every(function(chosen){ return chosen.job.n !== candidate.job.n; }) &&
        out[2].total - candidate.total <= 3;
    });
    if(replacement) out[2] = replacement;
  }
  return out.sort(function(a,b){ return b.total - a.total; });
}

function mismatchReason(scored){
  const penalty = scored.primaryPenalty;
  if(penalty.kind === "hardPC") return "PC環境が前提のため、現在の環境では準備負担が大きくなります。";
  if(penalty.kind === "verifyGate") return "情報の確認精度が重要なため、検証手順を身につけてからのほうが安全です。";
  if(penalty.kind === "emotion") return "共感力だけでなく、同じ話を聞き続ける忍耐力と感情を切り替える力が求められます。";
  if(penalty.kind === "time") return "毎週の作業時間を安定して確保する必要があり、今の条件では継続負担が大きくなります。";
  if(penalty.kind === "readiness") return READINESS_REASON[penalty.key] + "が求められるため、先に小さな練習が必要です。";
  return AXIS_REASON[penalty.key] + "が今の回答傾向と離れており、無理をすると消耗しやすい組み合わせです。";
}

function pickUnfit(ranked, fit){
  const fitNames = fit.map(function(item){ return item.job.n; });
  const candidates = ranked.filter(function(item){
    return item.job.ok !== false && fitNames.indexOf(item.job.n) < 0;
  }).sort(function(a,b){ return b.unfitScore - a.unfitScore || a.job.n.localeCompare(b.job.n,"ja"); });
  const out = [], categoryCounts = {};
  for(const scored of candidates){
    const category = scored.job.cat;
    if((categoryCounts[category] || 0) >= 2) continue;
    categoryCounts[category] = (categoryCounts[category] || 0) + 1;
    scored.mismatchReason = mismatchReason(scored);
    out.push(scored);
    if(out.length === 3) break;
  }
  return out;
}

function axisHTML(norm){
  return AXES.map(function(a){
    const v = norm[a.k];
    const pct = Math.round((v + 1) / 2 * 100);
    const isPos = v >= 0;
    const strength = Math.round(Math.abs(v) * 100);
    const label = isPos ? a.pos : a.neg;
    const left = isPos ? 50 : pct;
    const width = Math.abs(pct - 50);
    return '<div class="axis">' +
      '<div class="axis-top"><span>' + esc(a.neg) + '</span><span>' + esc(a.pos) + '</span></div>' +
      '<div class="axis-bar"><div class="axis-fill" style="left:' + left + '%;width:' + Math.max(width,1) + '%"></div></div>' +
      '<div class="axis-top" style="margin-top:5px"><b>' + esc(label) + '</b><span>' + strength + '%</span></div>' +
      '</div>';
  }).join("");
}

function runSelfChecks(){
  const errors = [];
  if(QUESTIONS.length !== 40) errors.push("設問数が40ではありません");
  AXES.forEach(function(axis){
    const items = QUESTIONS.filter(function(question){ return question.axis === axis.k; });
    if(items.length !== 8) errors.push(axis.k + "の設問数が8ではありません");
    if(items.filter(function(question){ return question.rev; }).length !== 4) errors.push(axis.k + "の逆転項目が4問ではありません");
    if(items.filter(function(question){ return question.anchor; }).length < 2) errors.push(axis.k + "の同点判定アンカーが不足しています");
  });
  if(QUESTIONS.filter(function(question){ return question.kind === "supplemental"; }).length !== 8) errors.push("実行条件の設問数が8ではありません");
  if(Object.keys(TYPES).length !== 16) errors.push("タイプ数が16ではありません");
  if(JOBS.length !== 30) errors.push("副業数が30ではありません");
  if(Object.keys(JOB_PROFILES).length !== JOBS.length) errors.push("副業プロファイル数が一致しません");
  JOBS.forEach(function(job){ if(!JOB_PROFILES[job.n]) errors.push(job.n + "の副業プロファイルがありません"); });
  Object.keys(TYPES).forEach(function(code){
    const norm = {}, raw = {};
    AXES.forEach(function(axis,index){
      norm[axis.k] = code[index] === axis.pl ? .75 : -.75;
      raw[axis.k] = code[index] === axis.pl ? 12 : -12;
    });
    const profile = {norm:norm,raw:raw,indicators:{pc:1,digital:.75,verify:.75,admin:.75,emotion:.75,time:.75},values:new Array(40).fill(0)};
    if(typeCode(profile) !== code) errors.push(code + "を再現できません");
    const ranked = rankJobs(profile), fit = pickFit(ranked), unfit = pickUnfit(ranked,fit);
    const names = fit.concat(unfit).map(function(item){ return item.job.n; });
    if(fit.length !== 3 || unfit.length !== 3 || new Set(names).size !== 6) errors.push(code + "の推薦件数または重複が不正です");
    if(fit.some(function(item){ return item.job.ok === false || !item.eligible; })) errors.push(code + "に推薦対象外の副業が入りました");
    if(fit.filter(function(item){ return item.job.cat === "受託"; }).length > 2) errors.push(code + "で受託が3件並びました");
    const unfitCounts = {};
    unfit.forEach(function(item){ unfitCounts[item.job.cat] = (unfitCounts[item.job.cat] || 0) + 1; });
    if(Object.values(unfitCounts).some(function(count){ return count > 2; })) errors.push(code + "の下位候補で同一カテゴリが3件並びました");
  });
  [-2,0,2].forEach(function(value){
    const responseValues = new Array(40).fill(value);
    const first = computeScores(responseValues);
    const second = computeScores(responseValues);
    if(typeCode(first) !== typeCode(second)) errors.push("同一回答でタイプ判定が変わりました");
    if(pickFit(rankJobs(first)).length !== 3) errors.push("全回答" + value + "で推薦を3件選べません");
  });
  if(typeCode(computeScores(new Array(40).fill(0))) !== "FBLP") errors.push("全回答中立時の安全側判定が不正です");
  const noPcValues = new Array(40).fill(0);
  const pcQuestionIndex = QUESTIONS.findIndex(function(question){ return question.kind === "supplemental" && question.indicator === "digital"; });
  noPcValues[pcQuestionIndex] = -2;
  const noPcFit = pickFit(rankJobs(computeScores(noPcValues)));
  if(noPcFit.some(function(item){ return JOB_PROFILES[item.job.n].f.pc === true; })) errors.push("PCなし回答にPC必須副業が入りました");
  const lowEmotionValues = new Array(40).fill(0);
  QUESTIONS.forEach(function(question,index){ if(question.indicator === "emotion") lowEmotionValues[index] = question.rev ? 2 : -2; });
  const lowEmotionFit = pickFit(rankJobs(computeScores(lowEmotionValues)));
  if(lowEmotionFit.some(function(item){ return item.job.n === "傾聴・愚痴聞き（非医療）"; })) errors.push("感情耐性が低い回答に傾聴サービスが入りました");
  const lowVerifyValues = new Array(40).fill(0);
  const verifyQuestionIndex = QUESTIONS.findIndex(function(question){ return question.indicator === "verify"; });
  lowVerifyValues[verifyQuestionIndex] = -2;
  const lowVerifyFit = pickFit(rankJobs(computeScores(lowVerifyValues)));
  if(lowVerifyFit.some(function(item){ return item.job.n === "AI活用・業務効率化支援"; })) errors.push("検証準備度が低い回答にAI支援が入りました");
  if(errors.length) throw new Error("副業16タイプ診断の検証に失敗しました:\n" + errors.join("\n"));
  console.info("副業16タイプ診断 self-check passed: 32 axis questions, 8 readiness questions, 30 jobs, 16 types.");
}

runSelfChecks();
</script>
